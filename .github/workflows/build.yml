name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PayamBin.apk

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build relay server
        run: |
          cd relay
          for a in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags="-s -w" -o ../payambin-relay-linux-$a . ; done
          cp payambin-relay.service ../

      - uses: actions/upload-artifact@v4
        with:
          name: PayamBin-apk
          path: PayamBin.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PayamBin v${{ github.run_number }}
          files: |
            PayamBin.apk
            payambin-relay-linux-amd64
            payambin-relay-linux-arm64
            payambin-relay.service
          make_latest: true
